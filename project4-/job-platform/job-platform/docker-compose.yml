services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobdb
      POSTGRES_USER: jobuser
      POSTGRES_PASSWORD: jobpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://jobuser:jobpass@postgres:5432/jobdb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MAX_RETRIES: 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker1:
    build: .
    command: python -m workers.executor
    environment:
      DATABASE_URL: postgresql+psycopg://jobuser:jobpass@postgres:5432/jobdb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MAX_RETRIES: 3
      WORKER_ID: worker-1
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker2:
    build: .
    command: python -m workers.executor
    environment:
      DATABASE_URL: postgresql+psycopg://jobuser:jobpass@postgres:5432/jobdb
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MAX_RETRIES: 3
      WORKER_ID: worker-2
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
